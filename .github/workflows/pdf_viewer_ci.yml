# Tests the PDF viewer on every change to the fork's branch.
name: PDF viewer - CI

on:
  push:
    branches: [pdf-viewer]
  pull_request:
    branches: [pdf-viewer]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pdf-viewer-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    if: github.repository_owner != 'zed-industries'
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The remote server parity check compares against the upstream release tag.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Free disk space
        run: script/pdf-viewer/ci-free-disk

      # Saved only from the pdf-viewer branch so pull requests reuse it without
      # filling the repository's cache quota with their own copies.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/pdf-viewer' }}

      - name: Install Pdfium
        run: script/pdf-viewer/fetch-pdfium

      - name: Remote server parity with upstream
        run: script/pdf-viewer/check-remote-server-parity

      - name: Unit and integration tests
        run: cargo test --package pdf_viewer --package kkpdf-zed

      - name: Clippy
        run: cargo clippy --package pdf_viewer --package kkpdf-zed --all-targets -- --deny warnings

      - name: Formatting
        run: cargo fmt --package pdf_viewer --package kkpdf-zed -- --check

      - name: Visual scenarios
        env:
          VISUAL_TEST_ONLY: pdf_viewer
          UPDATE_BASELINE: "1"
          VISUAL_TEST_OUTPUT_DIR: target/pdf-viewer-visual
        run: |
          cargo build --package zed --bin zed_visual_test_runner \
            --features visual-tests,gpui_platform/runtime_shaders
          target/debug/zed_visual_test_runner

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-viewer-screenshots
          path: target/pdf-viewer-visual
          if-no-files-found: ignore
